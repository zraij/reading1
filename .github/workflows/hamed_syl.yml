name: حامد بنطق المعلم
on:
  workflow_dispatch:
  push:
    paths: ['tts/hamed_syl.py']
permissions:
  contents: write
concurrency: { group: hamed-syl, cancel-in-progress: true }
jobs:
  conv:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: which ffmpeg || sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null || (sudo apt-get update >/dev/null && sudo apt-get install -y ffmpeg >/dev/null)
      - run: pip install torch==2.4.1 torchaudio==2.4.1 --index-url https://download.pytorch.org/whl/cpu && pip install numpy scipy soundfile
      - run: mkdir -p audio/hamed_syl && set -o pipefail && python -u tts/hamed_syl.py 2>&1 | tail -c 30000 | tee audio/hamed_syl/log.txt
      - if: always()
        run: |
          git config user.name "audio-bot"
          git config user.email "audio-bot@users.noreply.github.com"
          git add audio/hamed_syl
          git diff --cached --quiet || (git commit -m "حامد بنطق المعلم" && git pull --rebase && git push)
