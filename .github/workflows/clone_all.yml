name: تحويل الكتاب إلى صوت المعلم
on:
  workflow_dispatch:
  push:
    paths: ['tts/clone_all.json']
permissions:
  contents: write
concurrency: { group: clone-all, cancel-in-progress: true }
jobs:
  part:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3, 4, 5] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: which ffmpeg || sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null || (sudo apt-get update >/dev/null && sudo apt-get install -y ffmpeg >/dev/null)
      - run: pip install torch==2.4.1 torchaudio==2.4.1 --index-url https://download.pytorch.org/whl/cpu && pip install edge-tts numpy scipy soundfile
      - run: python -u tts/clone_all.py ${{ matrix.shard }} 6
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'clone-${{ matrix.shard }}', path: out/clone, if-no-files-found: ignore, retention-days: 3 }
  merge:
    needs: part
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: parts, pattern: 'clone-*', merge-multiple: true }
      - name: دمج
        run: |
          mkdir -p audio/clone
          [ -d parts ] && cp parts/*.mp3 audio/clone/ 2>/dev/null || true
          python3 - <<'EOF'
          import json, glob, os
          idx = {}
          try: idx = json.load(open('audio/clone/index.json'))
          except Exception: pass
          for p in glob.glob('parts/part_*.json'): idx.update(json.load(open(p)))
          keys = set(json.load(open('tts/keys.json')))
          idx = {k: v for k, v in idx.items() if k in keys and os.path.exists('audio/clone/' + v['f'])}
          used = {v['f'] for v in idx.values()}
          for f in os.listdir('audio/clone'):
              if f.endswith('.mp3') and f not in used: os.remove('audio/clone/' + f)
          json.dump(idx, open('audio/clone/index.json', 'w'), ensure_ascii=False, separators=(',', ':'))
          print('clone index', len(idx))
          EOF
      - name: حفظ
        run: |
          git config user.name "audio-bot"
          git config user.email "audio-bot@users.noreply.github.com"
          git add audio/clone
          git diff --cached --quiet || (git commit -m "صوت المعلم المستنسخ" && git pull --rebase && git push)
