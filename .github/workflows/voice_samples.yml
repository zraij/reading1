name: عينات الأصوات
on:
  workflow_dispatch:
  push:
    paths: ['tts/voice_samples.json']
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: which ffmpeg || sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null || (sudo apt-get update >/dev/null && sudo apt-get install -y ffmpeg >/dev/null)
      - run: pip install edge-tts && python -u tts/voice_samples.py
      - run: |
          git config user.name "audio-bot"
          git config user.email "audio-bot@users.noreply.github.com"
          git add audio/voice_samples
          git diff --cached --quiet || (git commit -m "عينات الأصوات" && git pull --rebase && git push)
