name: توليد الأصوات
on:
  workflow_dispatch:
  push:
    paths: ['tts/manifest.json', 'tts/make_audio.py']
permissions:
  contents: write
concurrency: { group: tts, cancel-in-progress: true }
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: which ffmpeg || sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null || (sudo apt-get update >/dev/null && sudo apt-get install -y ffmpeg >/dev/null)
      - run: pip install edge-tts "git+https://github.com/nipponjo/tts_arabic.git"
      - run: python tts/make_audio.py
      - name: حفظ الأصوات
        run: |
          git config user.name "audio-bot"
          git config user.email "audio-bot@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || (git commit -m "توليد الأصوات" && git pull --rebase && git push)
