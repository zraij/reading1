<script>
const AX = (() => {
  const enc = new TextEncoder(), dec = new TextDecoder();
  const ub = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const bu = (b) => { const a = new Uint8Array(b); let s = ''; for (let i = 0; i < a.length; i += 8192) s += String.fromCharCode(...a.subarray(i, i + 8192)); return btoa(s); };
  const rnd = (n) => crypto.getRandomValues(new Uint8Array(n));
  const hex = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('');
  const norm = (u) => String(u || '').trim().toLowerCase();
  async function uidOf(U, u) { return hex(await crypto.subtle.digest('SHA-256', new Uint8Array([...ub(U.ss), ...enc.encode(u)]))).slice(0, 24); }
  async function wkey(u, p, salt, it, use) {
    const base = await crypto.subtle.importKey('raw', enc.encode(u + ':' + p), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, [use]);
  }
  const kimp = (raw, use) => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, use);
  async function unwrap(U, user, pw) {
    const u = norm(user), id = await uidOf(U, u), e = U.u.find((x) => x.i === id);
    if (!e) return null;
    try { const raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(e.v), additionalData: enc.encode(id) }, await wkey(u, pw, ub(e.s), U.it, 'decrypt'), ub(e.k)); return { raw: new Uint8Array(raw), entry: e }; } catch (_) { return null; }
  }
  async function meta(K, e) {
    const [iv, ct] = e.m.split('.');
    return JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(iv) }, await kimp(K, ['decrypt']), ub(ct))));
  }
  async function makeEntry(U, K, user, pw, name, admin) {
    const u = norm(user), id = await uidOf(U, u), salt = rnd(16), wiv = rnd(12), miv = rnd(12);
    const k = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: wiv, additionalData: enc.encode(id) }, await wkey(u, pw, salt, U.it, 'encrypt'), K);
    const m = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: miv }, await kimp(K, ['encrypt']), enc.encode(JSON.stringify({ u, n: name, t: new Date().toISOString().slice(0, 10) })));
    return { i: id, a: admin ? 1 : 0, s: bu(salt), v: bu(wiv), k: bu(k), m: bu(miv) + '.' + bu(m) };
  }
  async function fetchUsers(fallback) {
    try { const r = await fetch('users.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) return await r.json(); } catch (_) {}
    return fallback;
  }
  return { ub, bu, rnd, norm, uidOf, unwrap, meta, makeEntry, fetchUsers, kimp };
})();
</script>
